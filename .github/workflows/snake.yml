name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:       # lets you trigger it manually
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Slow down the snake
        run: |
          sudo chmod -R a+rw dist
          python3 - <<'EOF'
          import re, glob

          SPEED_FACTOR = 2  # 2 = twice as slow. Try 3 or 4 for even slower.

          for path in glob.glob('dist/*.svg'):
              with open(path) as f:
                  content = f.read()
              content = re.sub(
                  r'animation:none (\d+)ms',
                  lambda m: f'animation:none {int(m.group(1)) * SPEED_FACTOR}ms',
                  content
              )
              with open(path, 'w') as f:
                  f.write(content)
          EOF

      - name: Push snake svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
